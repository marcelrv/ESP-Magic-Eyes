; ESP Magic Eyes — PlatformIO project configuration
;
; One firmware image for every board: which radar module is fitted (none,
; HLK-LD2420 or HLK-LD2450) is a runtime setting on the Radar setup page
; (NvsStore::getRadarType()), not a build variant. See include/pin_map.h
; for the GPIO map and the architecture plan for the full rationale.
;
; NOTE on radar library pin (see PROGRESS.md "Notes / deviations"):
; the plan's skeleton named "bolukan/ld2420" for the LD2420 driver, but
; that GitHub repo is actually a renamed fork of an LD2410 (not LD2420)
; library and is not published to the PlatformIO registry. It was
; swapped for gsieben/LD2420GeoGab, a registry-published driver
; actually targeting the HLK-LD2420 sensor. Phase 5 (radar
; implementation) should re-validate this choice against the physical
; module before relying on it.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
; Phase 3: motion/eye_pose.h uses std::optional<float> (EyeCommand's
; per-axis "is this set" fields) — the espressif32 Arduino toolchain
; defaults to -std=gnu++11, so bump to gnu++17 (still well within what
; the pinned xtensa-esp32-elf-gcc toolchain supports).
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
  esp32async/AsyncTCP @ 3.5.0
  esp32async/ESPAsyncWebServer @ 3.12.1
  madhephaestus/ESP32Servo @ 3.2.1
  adafruit/Adafruit NeoPixel @ 1.15.5
  bblanchon/ArduinoJson @ 7.4.3
  gsieben/LD2420GeoGab @ 1.0.0
